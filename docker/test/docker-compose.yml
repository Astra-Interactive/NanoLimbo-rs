# velocity 25577   bungeecord 25578   standalone 25579   native 25580
#
# bench waits for all four, logs players into each, and exits non-zero if any refuses one.

name: nanolimbo-proxy-test

# Only velocity declares the build: five services naming one tag would race to write it.
x-harness: &harness
  image: nanolimbo-test:local
  restart: "no"

# The ping check the image ships. The long start period is for a first run, which has a proxy
# to fetch before anything listens.
x-proxy-health: &proxy-health
  start_period: 180s
  interval: 5s
  retries: 40

# Not the image's check: mc-monitor pings with protocol -1, and the limbo answers a version it
# does not know with "Unsupported client version".
x-limbo-health: &limbo-health
  test: ["CMD", "limbo-bench", "--players", "1", "--settle-seconds", "0", "health=127.0.0.1:25565"]
  start_period: 60s
  interval: 5s
  retries: 20

services:
  velocity:
    <<: *harness
    build:
      context: ../..
      dockerfile: docker/test/Dockerfile
    environment:
      TYPE: VELOCITY
      # Pinned so a rerun measures the same build.
      VELOCITY_VERSION: "4.1.1"
      VELOCITY_BUILD_ID: "24"
      SERVER_PORT: "25565"
      # The configuration below is complete, and fetching upstream defaults over it would make
      # a run depend on a third-party repository staying up.
      SKIP_DOWNLOAD_DEFAULTS: "true"
    volumes:
      # File by file: a directory mount on /config would hide the jar the image carries there.
      - ./velocity/velocity.toml:/config/velocity.toml:ro
      - ./velocity/forwarding.secret:/config/forwarding.secret:ro
      - ./velocity/plugins/nanolimbo_java_wrapper/settings.yml:/config/plugins/nanolimbo_java_wrapper/settings.yml:ro
    ports:
      - "25577:25565"
    healthcheck: *proxy-health
    # The wrapper waits up to ten seconds for the limbo to stop.
    stop_grace_period: 30s

  bungeecord:
    <<: *harness
    environment:
      TYPE: BUNGEECORD
      BUNGEE_JOB_ID: "2089"
      SERVER_PORT: "25565"
      SKIP_DOWNLOAD_DEFAULTS: "true"
    volumes:
      - ./bungeecord/config.yml:/config/config.yml:ro
      - ./bungeecord/modules.yml:/config/modules.yml:ro
      - ./bungeecord/plugins/nanolimbo_java_wrapper/settings.yml:/config/plugins/nanolimbo_java_wrapper/settings.yml:ro
    ports:
      - "25578:25565"
    healthcheck: *proxy-health
    stop_grace_period: 30s

  standalone:
    <<: *harness
    entrypoint: ["java", "-jar", "/config/plugins/nanolimbo_java_wrapper.jar", "/config"]
    volumes:
      - ./standalone/settings.yml:/config/settings.yml:ro
    ports:
      - "25579:25565"
    healthcheck: *limbo-health
    stop_grace_period: 30s

  native:
    <<: *harness
    entrypoint: ["nanolimbo"]
    working_dir: /config
    volumes:
      - ./native/settings.yml:/config/settings.yml:ro
    ports:
      - "25580:25565"
    healthcheck: *limbo-health

  bench:
    <<: *harness
    # limbo-bench takes an address, not a hostname; compose only promises service names.
    entrypoint:
      - sh
      - -ec
      - |
        for service in velocity bungeecord standalone native; do
          address="$$(getent hosts "$$service" | sed 's/[[:space:]].*//')"
          targets="$$targets $$service=$$address:25565"
        done
        exec limbo-bench --players "$$PLAYERS" --settle-seconds 1 --wait-seconds 120 $$targets
    environment:
      PLAYERS: "${PLAYERS:-5}"
    healthcheck:
      disable: true
    depends_on:
      velocity:
        condition: service_healthy
      bungeecord:
        condition: service_healthy
      standalone:
        condition: service_healthy
      native:
        condition: service_healthy
