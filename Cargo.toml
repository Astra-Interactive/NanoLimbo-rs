[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"
repository = "https://github.com/Nan1t/NanoLimbo"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
indexing_slicing = "warn"
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
bytes = "1"
flate2 = "1"
serde_json = "1"
thiserror = "2"
uuid = "1"
valence_nbt = { version = "0.8", features = ["binary", "preserve_order"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
