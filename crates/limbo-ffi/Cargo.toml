[package]
name = "limbo-ffi"
description = "A C ABI for embedding the limbo server in a host process."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# rlib as well, or `cargo test` has nothing to build a harness against.
[lib]
name = "nanolimbo_lib"
crate-type = ["cdylib", "rlib"]

[dependencies]
nanolimbo = { path = "../nanolimbo" }
tokio.workspace = true
tracing.workspace = true

# Does not inherit `[workspace.lints]`, which forbids `unsafe_code`. The rest are restated
# below so that opting out of one is not opting out of all.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
indexing_slicing = "warn"
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"
