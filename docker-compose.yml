# Runs the server.
#
#   docker compose up --build
#
# The image is a statically linked binary on an empty base, so there is no shell to exec
# into and no package manager to keep patched. Configuration lives in /data.

services:
  nanolimbo:
    build:
      context: .
    image: nanolimbo:local
    ports:
      - "25565:25565"
    volumes:
      # Read-only: the file is edited on the host, not in the container. Remove this line
      # and the server writes its own default into the volume on first run.
      - ./docker/settings.yml.example:/data/settings.yml:ro
    restart: unless-stopped
    # The console reads standard input. Without these it sees end-of-file at once and
    # simply stops listening for commands, which is fine for an unattended deployment.
    stdin_open: true
    tty: true
    # No healthcheck: the image has no shell and no tools to run one with, which is the
    # point of it. Check the port from outside instead.
