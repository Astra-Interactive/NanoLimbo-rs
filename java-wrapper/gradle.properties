# Gradle
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
# Java
klibs.java.source=21
klibs.java.target=21
klibs.java.ktarget=21
# Project
# klibs.project.version.string is deliberately absent: the artifact version is scraped from
# the Rust workspace manifest instead. See wrapper/build.gradle.kts.
klibs.project.name=nanolimbo-java-wrapper
klibs.project.group=ru.astrainteractive.nanolimbo
klibs.project.description=Runs the NanoLimbo-rs server inside a Velocity or BungeeCord proxy JVM
klibs.project.developers=makeevrserg|Makeev Roman|makeevrserg@gmail.com
klibs.project.url=https://github.com/Astra-Interactive/NanoLimbo-rs
# Base name of the Rust cdylib, without the platform prefix or the file extension
libName=nanolimbo_lib
# Identifies the plugin to both proxies, and names the data directory settings.yml lands in
pluginId=nanolimbo_java_wrapper
