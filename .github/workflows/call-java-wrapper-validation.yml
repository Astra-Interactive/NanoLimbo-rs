name: "java-wrapper-validation"
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # The same `./gradlew build` the release runs, minus the shared libraries: those cost
  # seven cross-compiled release builds to produce, and a broken build script, a missing
  # dependency or a Java source that no longer compiles does not need them to show
  # itself. Without this the first run of Gradle in a release happens after the
  # container image has already been published, and an image tag cannot be withdrawn.
  #
  # A jar built here has no server inside it and cannot start one; it is not uploaded
  # anywhere for that reason.
  java_wrapper_validation:
    name: Build the Java wrapper without its native libraries
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java-wrapper
    steps:
      - name: Checkout Git repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build the wrapper jar
        run: |
          chmod +x gradlew
          ./gradlew build
