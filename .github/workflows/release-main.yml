name: Release master
on:
  push:
    branches:
      - master

# Explicit least-privilege token permissions so the workflow behaves
# the same in personal repositories and organizations regardless of
# the default GITHUB_TOKEN settings. Jobs that need more (e.g. creating
# a release, pushing a package) elevate their permissions individually.
permissions:
  contents: read

# Not cancelled in progress, unlike the pull request check: an interrupted run can leave
# architecture images pushed with no manifest list naming them.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_name }}-${{ github.repository }}
  cancel-in-progress: false

jobs:
  lockfile_validation:
    name: Validate Cargo.lock
    uses: ./.github/workflows/call-lockfile-validation.yml
  # The pull request already ran this, but a push to the default branch need not have
  # come through one, and a tag and a public image tag cannot be withdrawn once pushed.
  # Tests are not repeated here; they gate the pull request.
  clippy_validation:
    name: Validate with clippy
    needs: lockfile_validation
    uses: ./.github/workflows/call-clippy-validation.yml
  upload_docker_registry:
    name: Publish container image
    needs: [ clippy_validation ]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/call-upload-docker-registry.yml
  # Alongside the image rather than after it: the seven cross-compiled targets are the
  # longest part of a release by some distance, and nothing about them depends on the
  # image being published.
  build_release_artifacts:
    name: Build release artifacts
    needs: [ clippy_validation ]
    uses: ./.github/workflows/call-build-release-artifacts.yml
  # The jar embeds the shared libraries the matrix above produced, so it can only be
  # assembled once they exist.
  build_java_wrapper:
    name: Build Java wrapper
    needs: [ build_release_artifacts ]
    uses: ./.github/workflows/call-build-java-wrapper.yml
  # Last, and only if the image is up and every asset exists: the tag is what tells
  # people a release happened, so it should not exist for a version nobody can pull, and
  # a release whose downloads are missing is read as a broken release rather than as an
  # unfinished one.
  upload_github_release:
    name: Upload GitHub release
    needs: [ upload_docker_registry, build_release_artifacts, build_java_wrapper ]
    permissions:
      contents: write
    uses: ./.github/workflows/call-upload-github-release.yml
    secrets:
      ACTIONS_TOKEN: ${{ secrets.ACTIONS_TOKEN }}
