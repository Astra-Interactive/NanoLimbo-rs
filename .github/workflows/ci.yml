name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The toolchain is pinned in rust-toolchain.toml; rustup honours it here.
      - name: Toolchain
        run: rustc --version && cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Includes the parity suites: packet bytes and text rendering against the
      # reference dumps, and the packet id tables against minecraft-data.
      - name: Test
        run: cargo test --workspace

  build:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Release build
        run: cargo build --workspace --release
      - uses: actions/upload-artifact@v4
        with:
          name: nanolimbo-linux-x86_64
          path: target/release/nanolimbo
          if-no-files-found: ignore
