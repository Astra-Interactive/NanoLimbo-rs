name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The toolchain is pinned in rust-toolchain.toml; rustup honours it here.
      - name: Toolchain
        run: rustc --version && cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Includes the parity suites: packet bytes and text rendering against the
      # reference dumps, and the packet id tables against minecraft-data.
      - name: Test
        run: cargo test --workspace

  # The image is built here rather than only by whoever deploys it: a Dockerfile that
  # nothing exercises is a Dockerfile that has already broken.
  image:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: nanolimbo:ci
      - name: The image must actually start
        run: |
          docker run --rm -d --name nanolimbo-ci -p 25565:25565 \
            -v "$PWD/docker/settings.yml.example:/data/settings.yml:ro" nanolimbo:ci
          for _ in $(seq 1 50); do
            if (exec 3<>/dev/tcp/127.0.0.1/25565) 2>/dev/null; then
              echo "listening"; docker rm -f nanolimbo-ci; exit 0
            fi
            sleep 0.2
          done
          echo "the container never listened"; docker logs nanolimbo-ci; exit 1

  build:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Release build
        run: cargo build --workspace --release
      - uses: actions/upload-artifact@v4
        with:
          name: nanolimbo-linux-x86_64
          path: target/release/nanolimbo
          if-no-files-found: ignore
