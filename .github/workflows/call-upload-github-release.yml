name: "upload-github-release"
on:
  workflow_call:
    secrets:
      ACTIONS_TOKEN:
        description: "Optional personal access token used to create the release. Falls back to the default GITHUB_TOKEN when not provided."
        required: false

# `contents: write` is required to create a release with the default GITHUB_TOKEN.
# The caller job must grant the same permission.
permissions:
  contents: write

jobs:
  upload_github_release:
    name: Upload GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read project version
        id: version
        uses: ./.github/actions/read-version
        with:
          manifest-path: './Cargo.toml'

      # Everything this run built, flattened into one directory. The archives and the
      # jar are named after what they contain, so a single pattern collects them and
      # leaves the shared libraries behind - those are an ingredient of the jar, not
      # something anyone downloads on its own.
      - name: Download the release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: nanolimbo_*
          merge-multiple: true

      # The container image is no longer the only way to get a build: the release now
      # carries a binary for each supported target and the Java wrapper jar, because a
      # Pterodactyl egg and a plugin-shaped wrapper both need a file to download rather
      # than an image to pull. The caller must therefore order this job after the builds
      # that produce them, and `fail_on_unmatched_files` is what turns a release that
      # quietly lost its assets into a failed one.
      - name: Create GitHub release
        id: create_github_release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.ACTIONS_TOKEN || github.token }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ github.event.repository.name }} - ${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: artifacts/*
          fail_on_unmatched_files: true
