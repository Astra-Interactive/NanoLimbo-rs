name: "docker-image-validation"
on:
  workflow_call:

permissions:
  contents: read

jobs:
  docker_image_validation:
    name: Build and exercise the container image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # Built here rather than only by whoever deploys it: a Dockerfile that nothing
      # exercises is a Dockerfile that has already broken. One platform only, because
      # this job answers "does it work", not "does it ship" - the release publishes both.
      - name: Build the container image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: nanolimbo:ci
          # The same cache scope the release build uses for this platform: a pull
          # request cannot write to the default branch's cache, but it can read it.
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,mode=max,scope=linux-amd64
      - name: Build the bench client
        run: cargo build --release --locked --bin limbo-bench
      # A port that accepts a connection proves very little. This logs a player all the
      # way into the world using the project's own client, so the check fails if the
      # image starts but cannot serve.
      - name: The image must serve a player
        run: |
          docker run --rm -d --name nanolimbo-ci -p 25565:25565 \
            -v "$PWD/docker/settings.yml.example:/data/settings.yml:ro" nanolimbo:ci
          if ! ./target/release/limbo-bench --wait-seconds 60 --players 1 \
               container=127.0.0.1:25565; then
            docker logs nanolimbo-ci
            docker rm -f nanolimbo-ci
            exit 1
          fi
          docker rm -f nanolimbo-ci
